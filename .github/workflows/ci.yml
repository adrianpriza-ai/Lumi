name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only ever reads the repo.
permissions:
  contents: read

# Superseded runs on a PR are wasted minutes. Runs on main are never cancelled,
# because main is the record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Same command the README tells you to run locally, so a green build
      # means the documented workflow is the one that actually works.
      - name: Ruff
        run: ruff check lumi tests

  test:
    name: pytest ${{ matrix.python-version }}
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One broken version should not hide the result on the others.
      fail-fast: false
      matrix:
        # The versions claimed in pyproject.toml classifiers. Add one there first.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite is hermetic: conftest points LUMI_HOME at a tmp dir, writes its
      # own dummy .env, and scrubs TAVILY/FIRECRAWL/EXA/MCP vars, so no secrets
      # and no network keys are needed here. If a test ever starts reading a real
      # credential, that is a bug in the test, not a reason to add a secret.
      - name: Pytest
        run: pytest -q

  rust-test:
    name: cargo test (lumi-tui)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lumi-tui

      # Same commands the lumi-tui README documents, so a green build means
      # the documented workflow is the one that actually works.
      - name: Test
        run: cargo test --locked --manifest-path lumi-tui/Cargo.toml

  rust-build:
    name: cargo build --release (lumi-tui)
    needs: rust-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lumi-tui

      # Prove the shipped artifact compiles, not just that the tests do.
      - name: Build
        run: cargo build --release --locked --manifest-path lumi-tui/Cargo.toml

  wheel:
    name: wheel ships the Rust UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lumi-tui

      # `pip install .` must yield one artifact: the Python package plus the
      # Rust UI it execs. hatch_build.py compiles the crate into the wheel.
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip
          pip wheel . --no-deps --wheel-dir dist

      - name: The wheel contains the UI binary
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "lumi/_bin/lumi-tui" in names, f"{wheel} has no lumi/_bin/lumi-tui"
          print(f"{wheel}: lumi/_bin/lumi-tui present")
          PY

      - name: Install the wheel
        run: pip install dist/*.whl

      # Run outside the checkout with a throwaway LUMI_HOME: the only UI in
      # reach is the bundled one, so `bundled` proves the wheel is enough.
      - name: Doctor reports a bundled UI
        run: |
          mkdir -p "$RUNNER_TEMP/lumi-ci"
          output="$(LUMI_HOME="$RUNNER_TEMP/lumi-ci" lumi doctor 2>&1 || true)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -F "rust ui — bundled"
