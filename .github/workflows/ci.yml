name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only ever reads the repo.
permissions:
  contents: read

# Superseded runs on a PR are wasted minutes. Runs on main are never cancelled,
# because main is the record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Same command the README tells you to run locally, so a green build
      # means the documented workflow is the one that actually works.
      - name: Ruff
        run: ruff check lumi tests

  test:
    name: pytest ${{ matrix.python-version }}
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One broken version should not hide the result on the others.
      fail-fast: false
      matrix:
        # The versions claimed in pyproject.toml classifiers. Add one there first.
        # "system" is ubuntu-latest's own /usr/bin/python3: the Code Mode sandbox
        # (lumi/tools/mcp/sandbox.py) only runs an interpreter that lives under
        # /usr, because /usr is all it bind-mounts into the bubblewrap jail.
        # actions/setup-python installs under the tool cache instead, so on the
        # pinned versions the sandbox tests skip and only "system" exercises
        # them — a skip there would mean the sandbox is never tested in CI.
        python-version: ["3.11", "3.12", "3.13", "system"]
    steps:
      - uses: actions/checkout@v7

      # The sandbox needs bubblewrap on PATH; ubuntu-latest does not ship it.
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap

      - uses: actions/setup-python@v7
        if: matrix.python-version != 'system'
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The Code Mode sandbox runs `sys._base_executable` inside bwrap with
      # only /usr mounted, so the interpreter under test has to be the system
      # one. A venv made from it keeps pip isolated while _base_executable
      # stays /usr/bin/python3, which is exactly the check sandbox.py makes.
      - name: Use the system Python
        if: matrix.python-version == 'system'
        run: echo "$HOME/.lumi-system-venv/bin" >> "$GITHUB_PATH"

      - name: Install
        run: |
          if [ "${{ matrix.python-version }}" = "system" ]; then
            /usr/bin/python3 -m venv "$HOME/.lumi-system-venv"
          fi
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite is hermetic: conftest points LUMI_HOME at a tmp dir, writes its
      # own dummy .env, and scrubs TAVILY/FIRECRAWL/EXA/MCP vars, so no secrets
      # and no network keys are needed here. If a test ever starts reading a real
      # credential, that is a bug in the test, not a reason to add a secret.
      #
      # Code Mode's sandbox tests must not skip silently: on the "system" runner
      # they have everything they need, so a skipped sandbox test there is a
      # failure. On the tool-cache versions the sandbox is legitimately
      # unavailable and the skip is the honest result.
      - name: Pytest
        run: |
          if [ "${{ matrix.python-version }}" = "system" ]; then
            # pipefail: `tee` must not swallow pytest's exit status.
            set -o pipefail
            status=0
            python -m pytest -q -rs -p no:cacheprovider | tee pytest.log || status=$?
            if grep -E "^SKIPPED .*test_mcp_(sandbox|codemode|tool)" pytest.log; then
              echo "::error::sandbox tests skipped on the system Python; bubblewrap or /usr python is missing"
              status=1
            fi
            exit "$status"
          else
            python -m pytest -q -rs
          fi

  rust-test:
    name: cargo test (lumi-tui)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lumi-tui

      # Same commands the lumi-tui README documents, so a green build means
      # the documented workflow is the one that actually works.
      - name: Test
        run: cargo test --locked --manifest-path lumi-tui/Cargo.toml

  rust-build:
    name: cargo build --release (lumi-tui)
    needs: rust-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lumi-tui

      # Prove the shipped artifact compiles, not just that the tests do.
      - name: Build
        run: cargo build --release --locked --manifest-path lumi-tui/Cargo.toml

  wheel:
    name: wheel ships the Rust UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lumi-tui

      # `pip install .` must yield one artifact: the Python package plus the
      # Rust UI it execs. hatch_build.py compiles the crate into the wheel.
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip
          pip wheel . --no-deps --wheel-dir dist

      - name: The wheel contains the UI binary
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "lumi/_bin/lumi-tui" in names, f"{wheel} has no lumi/_bin/lumi-tui"
          print(f"{wheel}: lumi/_bin/lumi-tui present")
          PY

      - name: Install the wheel
        run: pip install dist/*.whl

      # Run outside the checkout with a throwaway LUMI_HOME: the only UI in
      # reach is the bundled one, so `bundled` proves the wheel is enough.
      - name: Doctor reports a bundled UI
        run: |
          mkdir -p "$RUNNER_TEMP/lumi-ci"
          output="$(LUMI_HOME="$RUNNER_TEMP/lumi-ci" lumi doctor 2>&1 || true)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -F "rust ui — bundled"
