# Lumi configuration. Committed on purpose: no secrets, only behaviour.
# Override any key with LUMI__<SECTION>__<KEY>, e.g. LUMI__LLM__MODEL=claude-sonnet-4-5

[bot]
# Chat the bot greets you in. Optional.
startup_chat_id = ""
# Refuse to boot without TELEGRAM_OWNER_ID. Keep true: tools are owner-only.
require_owner = true
# Group behaviour: mention (default) | always | off. Private chats unaffected.
group_reply_mode = "mention"
# Optional overrides (Telegram ids are negative for supergroups):
#   always_reply_chats = ["-1001234567890"]
#   whitelisted_groups = ["-1001234567890"]
#   whitelisted_users = ["123456789", "987654321"]
# SOCKS5/HTTP proxy for the Bot API. Empty = direct connection.
proxy_url = ""
# Bot API connect timeout (s). Raise on slow networks.
connect_timeout = 15.0
# Extra startup attempts after network failure. 0 = once, -1 = retry forever.
bootstrap_retries = -1
# Max document size sent to chat (MB). Telegram's own limit is 50.
max_upload_mb = 20

[llm]
# Any OpenAI-compatible endpoint (OpenAI, Ollama, LM Studio, vLLM, Groq, ...).
provider = "openai"
# Empty = OPENAI_BASE_URL / OPENAI_API_BASE from .env, then OpenAI.
#   base_url = "http://localhost:11434/v1"   # Ollama
base_url = ""
# Empty = OPENAI_MODEL from .env or the default. Set to pin the model.
model = ""
# Model for image turns. Empty = use `model`.
vision_model = ""
# Env var holding the key. Comma-separated values make a rotation pool.
api_key_env = "OPENAI_API_KEY"
# fallback | round_robin | random
key_strategy = "fallback"
# Extra attempts on transient errors or empty answers.
inference_retries = 4
# Initial backoff delay (s), doubling each retry.
inference_retry_delay = 0.5
# Provider default when reasoning = true.
temperature = 0.7
# Output token ceiling. 0 = no limit.
max_tokens = 0
# Max tool-call round trips per message.
max_tool_iterations = 20
# Prior turns replayed on a fresh conversation. 0 = as many as fit.
history_turns = 0
# Cap on each chat's MEMORY.md block in the system prompt. 0 = context-derived cap.
max_memory_chars = 0

# --- Context window ---
# Set to your model's real limits.
context_window = 200000
# Reserved for the reply. Set to the model's max output tokens.
context_headroom = 16000
# Newest turns that are never condensed.
context_keep_recent = 12
# Soft fill target as a fraction of the usable budget. 1.0 = hard budget only.
context_target = 1.0
# Summarise the oldest messages before dropping them.
compaction = true
# Chats kept in memory at once.
max_conversations = 32

# --- Reasoning models ---
# Enable for thinking models (gpt-oss, DeepSeek reasoner, Qwen3, o-series, ...).
reasoning = false
# none | minimal | low | medium | high | xhigh | max. Empty = "medium".
reasoning_effort = ""
# Extra token headroom for the thinking trace.
reasoning_tokens = 0
# Show live step list (thinking + tools) in chat.
show_reasoning = true

[tools]
# Remove a tool from this list to disable it everywhere.
enabled = ["shell", "files", "read_file", "list_files", "grep", "memory", "web", "context7", "send"]

[tools.shell]
enabled = true
# Working directory relative to the project root.
cwd = "workspace"
timeout_seconds = 60
# Output chars sent to the model. 0 = all.
max_output_chars = 0
# Hard-block anything not plainly safe (no prompts).
ask_before_risky = true
# project = pin HOME to the project root | inherit = real HOME.
home = "project"
# Writable paths relative to the project root. Empty = whole project.
writable = []
extra_deny = []
# Regexes matched against the raw command; a hit asks for confirmation.
extra_confirm = []

[tools.files]
enabled = true
# Writable directories relative to the project root.
writable = ["workspace"]
# Chars handed to the model per read. 0 = no cap.
max_read_chars = 200000
max_write_chars = 200000
# Allow sending files to the chat.
uploads = true

[tools.memory]
enabled = true
# Let the model call remember(). Deletion is human-only (/forget).
auto_remember = true

[tools.web]
enabled = true
# Providers tried in order; the first available one answers.
provider_order = ["firecrawl", "exa", "tavily", "mcp"]
# Hits per search. 0 = whatever the model asks for.
max_results = 10
# Top up from the next provider below this many hits.
min_results = 2
# Body chars per search/page. 0 = no cap.
max_content_chars = 0
# Per-provider call timeout (s).
timeout_seconds = 90

[tools.web.providers.tavily]
enabled = true
api_key_env = "TAVILY_API_KEY"
search_depth = "basic"      # basic | advanced | fast | ultra-fast
topic = "general"           # general | news | finance
include_answer = true
include_raw_content = true
base_url = "https://api.tavily.com"
# Unset key = free tier. fallback | round_robin | random.
key_strategy = "fallback"

[tools.web.providers.firecrawl]
enabled = true
api_key_env = "FIRECRAWL_API_KEY"
base_url = "https://api.firecrawl.dev"
only_main_content = true
# Scrape this many hits when results lack body text.
auto_scrape_top_n = 3
# fallback | round_robin | random. No keyless tier.
key_strategy = "fallback"

[tools.web.providers.exa]
enabled = true
api_key_env = "EXA_API_KEY"
base_url = "https://api.exa.ai"
# auto | neural | keyword
search_type = "auto"
# Optional category filter, e.g. news, github, paper.
category = ""
# fallback | round_robin | random. No keyless tier.
key_strategy = "fallback"

[tools.web.providers.mcp]
enabled = true
# Project file merged with the user-level file. "" disables the latter.
config_file = ".mcp.json"
user_config_file = "~/.agents/mcp.json"
timeout_seconds = 60
# Tool name patterns; first match wins.
search_tools = ["web_search_exa", "tavily_search", "firecrawl_search", "search"]
fetch_tools = ["crawl_urls", "tavily_extract", "firecrawl_scrape", "scrape", "extract"]

[tools.context7]
# Auto-enables when CONTEXT7_API_KEY is set.
enabled = true
# Comma-separated values make a rotation pool.
api_key_env = "CONTEXT7_API_KEY"
base_url = "https://context7.com/api/v2"
timeout_seconds = 30
# fallback | round_robin | random
key_strategy = "fallback"

[logging]
level = "INFO"
file = "data/logs/lumi.log"
