<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumi Privacy Policy</title>
  <meta name="description" content="Lumi privacy policy.">

  <script src="https://cdn.jsdelivr.net/npm/markdown@0.5.0/lib/markdown.js"></script>

  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    body {
      margin: 0;
      padding: 2rem 1rem;
      background: Canvas;
      color: CanvasText;
    }

    main {
      width: min(800px, 100%);
      margin: 0 auto;
    }

    a {
      color: LinkText;
    }

    pre,
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    pre {
      overflow-x: auto;
    }

    #error {
      color: #b00020;
    }
  </style>
</head>
<body>
  <main id="content">
    <p>Loading privacy policy…</p>
  </main>

  <script>
    fetch('./policy.md')
      .then(response => {
        if (!response.ok) {
          throw new Error(`Failed to load policy.md (${response.status})`);
        }
        return response.text();
      })
      .then(markdownText => {
        document.getElementById('content').innerHTML = markdown.toHTML(markdownText);
      })
      .catch(error => {
        document.getElementById('content').innerHTML =
          `<p id="error">Unable to load the privacy policy.</p>`;
        console.error(error);
      });
  </script>
</body>
</html>
