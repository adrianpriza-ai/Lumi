<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumi Privacy Policy</title>
  <meta name="description" content="Lumi privacy policy.">

  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>

  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    body {
      margin: 0;
      padding: 2rem 1rem;
      background: Canvas;
      color: CanvasText;
    }

    main {
      width: min(800px, 100%);
      margin: 0 auto;
    }

    a {
      color: LinkText;
    }

    pre,
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    pre {
      overflow-x: auto;
    }

    /* render some intentional HTML from the policy markdown */
    .center {
      text-align: center;
    }

    /* tables are not part of the CommonMark subset the old parser shipped, so
       make sure they render when the policy uses them */
    main table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
    }

    main th,
    main td {
      border: 1px solid CanvasText;
      padding: 0.4em 0.6em;
      text-align: left;
      vertical-align: top;
    }

    main th {
      background: Canvas;
    }

    #error {
      color: #b00020;
    }
  </style>
</head>
<body>
  <main id="content">
    <p>Loading privacy policy…</p>
  </main>

  <script>
    fetch('./policy.md')
      .then(response => {
        if (!response.ok) {
          throw new Error(`Failed to load policy.md (${response.status})`);
        }
        return response.text();
      })
      .then(markdownText => {
        const md = window.markdownit().disable('code', {use: false}).disable('pre', {use: false});
        document.getElementById('content').innerHTML = md.render(markdownText);
      })
      .catch(error => {
        document.getElementById('content').innerHTML =
          `<p id="error">Unable to load the privacy policy.</p>`;
        console.error(error);
      });
  </script>
</body>
</html>
