[package]
name = "lumi-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal UI frontend for Lumi: a ratatui shell over the `lumi tui` Python backend"
license = "MIT"

[[bin]]
name = "lumi-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = "0.29"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = true
